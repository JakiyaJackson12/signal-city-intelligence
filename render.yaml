services:
  - type: web
    name: signal-city-fullstack
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: SIGNAL_DB
        value: /tmp/signal_observations.sqlite3
